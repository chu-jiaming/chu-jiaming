name: Recently played

# Apple Music has no public "now playing" API, so tracks are scrobbled to Last.fm
# (e.g. with a macOS scrobbler app) and read from there.
# Setup: repo secret LASTFM_API_KEY and repo variable LASTFM_USER.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update README
        if: ${{ vars.LASTFM_USER != '' }}
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ vars.LASTFM_USER }}
        run: python3 scripts/now_playing.py

      - name: Commit
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update recently played"
          git push
