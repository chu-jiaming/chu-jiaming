name: Stats cards

# Self-generated replacement for github-readme-stats; published to the
# `output` branch alongside the snake (keep_history so neither wipes the other).

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stats.yml, scripts/stats_cards.py]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: output
          path: dist

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats_cards.py ${{ github.repository_owner }} "Jiaming Chu" dist

      - name: Publish
        working-directory: dist
        run: |
          git add stats.svg top-langs.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stats cards"
          git push
